<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Acervo</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Newsreader:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<main class="auth-wrap">
  <section class="auth-card glass" id="card">
    <div class="mark" aria-hidden="true">“</div>
    <h1>Quotes and Articles</h1>
    <p class="sub">Quotes, notas, estudos e artigos.</p>

    <div class="seg" id="seg" data-i="0" role="tablist">
      <button type="button" role="tab" aria-selected="true">Entrar</button>
      <button type="button" role="tab" aria-selected="false">Criar conta</button>
      <button type="button" role="tab" aria-selected="false">Admin</button>
    </div>

    <form id="readerForm" class="pane">
      <label for="ruser">Usuário</label>
      <input id="ruser" class="input" required maxlength="20" autocomplete="username" autocapitalize="none" placeholder="seu_usuario">
      <label for="rpass">Senha</label>
      <input id="rpass" class="input" type="password" required autocomplete="current-password" placeholder="Sua senha">
      <p class="err" id="rerr" role="alert"></p>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>

    <form id="signForm" class="pane" hidden>
      <label for="sname">Seu nome</label>
      <input id="sname" class="input" required maxlength="30" autocomplete="name" placeholder="Como quer ser chamado">
      <label for="suser">Usuário (para entrar)</label>
      <input id="suser" class="input" required maxlength="20" autocomplete="username" autocapitalize="none" placeholder="letras, números e _">
      <label for="spass">Senha</label>
      <input id="spass" class="input" type="password" required minlength="6" autocomplete="new-password" placeholder="Mínimo de 6 caracteres">
      <p class="err" id="serr" role="alert"></p>
      <button class="btn btn-primary" type="submit">Criar conta</button>
    </form>

    <form id="adminForm" class="pane" hidden>
      <label for="pw">Senha de administrador</label>
      <input id="pw" class="input" type="password" autocomplete="current-password" placeholder="Digite a senha" required>
      <p class="err" id="err" role="alert"></p>
      <button class="btn btn-primary" type="submit">Entrar como administrador</button>
    </form>

    <p class="credit">by Pedro Henrique Frutuoso</p>
  </section>
</main>
<script src="../js/config.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
