<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Acervo</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/login.css">
</head>
<body class="lg">
<div class="lg-photo" aria-hidden="true"></div>
<div class="lg-shade" aria-hidden="true"></div>

<main class="lg-wrap">
  <section class="lg-card" id="card">
    <header class="lg-top">
      <span>Quotes and Articles</span>
    </header>

    <!-- Entrar -->
    <form id="readerForm" class="lg-form">
      <h1>Entrar</h1>
      <p class="lg-sub">Bem-vindo de volta. Entre na sua conta.</p>
      <input id="ruser" class="lg-in" required maxlength="20" autocomplete="username" autocapitalize="none" placeholder="Usuário" aria-label="Usuário">
      <div class="pwrap">
        <input id="rpass" class="lg-in" type="password" required autocomplete="current-password" placeholder="Senha" aria-label="Senha">
      </div>
      <div class="lg-row">
        <label class="lg-check"><input type="checkbox" id="remember" checked><span></span>Lembrar de mim</label>
        <button type="button" class="lg-link" id="forgot">Esqueci a senha</button>
      </div>
      <p class="lg-err" id="rerr" role="alert"></p>
      <button class="lg-btn" type="submit">Entrar</button>
      <p class="lg-alt">Não tem conta? <button type="button" class="lg-link" data-go="1">Criar conta</button></p>
    </form>

    <!-- Criar conta -->
    <form id="signForm" class="lg-form" hidden>
      <h1>Criar conta</h1>
      <p class="lg-sub">Crie sua conta para curtir, salvar e comentar.</p>
      <input id="suser" class="lg-in" required minlength="3" maxlength="20" autocomplete="username" autocapitalize="none" placeholder="Usuário (apenas letras)" aria-label="Usuário">
      <input id="sname" class="lg-in" required maxlength="30" autocomplete="nickname" placeholder="Nome social (como quer aparecer)" aria-label="Nome social">
      <div class="pwrap">
        <input id="spass" class="lg-in" type="password" required minlength="5" maxlength="5" autocomplete="new-password" placeholder="Senha (5 letras ou números)" aria-label="Senha">
      </div>
      <p class="lg-err" id="serr" role="alert"></p>
      <button class="lg-btn" type="submit">Criar conta</button>
      <p class="lg-alt">Já tem conta? <button type="button" class="lg-link" data-go="0">Entrar</button></p>
    </form>

    <!-- Administrador -->
    <form id="adminForm" class="lg-form" hidden>
      <h1>Administrador</h1>
      <p class="lg-sub">Acesso restrito ao CEO do acervo.</p>
      <div class="pwrap">
        <input id="pw" class="lg-in" type="password" required autocomplete="current-password" placeholder="Senha de administrador" aria-label="Senha de administrador">
      </div>
      <p class="lg-err" id="err" role="alert"></p>
      <button class="lg-btn" type="submit">Entrar</button>
      <p class="lg-alt"><button type="button" class="lg-link" data-go="0">← Voltar</button></p>
    </form>
  </section>

  <footer class="lg-foot">by Pedro Henrique Frutuoso · <button type="button" class="lg-link" id="toAdmin">Administrador</button></footer>
</main>
<script src="../js/config.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
